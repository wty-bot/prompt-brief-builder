name: Release Desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: true

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint and tests
        run: npm run lint && npm run test:run

      - name: Build Windows installer
        env:
          ELECTRON_CACHE: ${{ runner.temp }}\electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}\electron-builder-cache
        run: npm run dist:win

      - name: Prepare release notes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $body = Get-Content -Raw -Encoding UTF8 RELEASE_NOTES.md
          $body = $body -replace "Prompt Brief Builder v0\.3\.0", "Prompt Brief Builder $version"
          Set-Content -Path release-notes.md -Value $body -Encoding UTF8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Prompt Brief Builder ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            release/*.exe
            release/*.blockmap
