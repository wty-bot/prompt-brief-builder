name: Release Desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: true

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint and tests
        run: npm run lint && npm run test:run

      - name: Build Windows installer
        env:
          ELECTRON_CACHE: ${{ runner.temp }}\electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}\electron-builder-cache
        run: npm run dist:win

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Prompt Brief Builder ${{ github.ref_name }}
          body: |
            Windows desktop release for Prompt Brief Builder.

            Download the NSIS installer below, run it, then launch Prompt Brief Builder from the Start Menu or desktop shortcut.
          files: |
            release/*.exe
            release/*.blockmap
