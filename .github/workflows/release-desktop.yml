name: Release Desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: true

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint and tests
        run: npm run lint && npm run test:run

      - name: Build Windows installer
        env:
          ELECTRON_CACHE: ${{ runner.temp }}\electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}\electron-builder-cache
        run: npm run dist:win

      - name: Prepare release notes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $body = Get-Content -Raw -Encoding UTF8 RELEASE_NOTES.md
          $body = $body -replace "Prompt Brief Builder v[0-9]+\.[0-9]+\.[0-9]+", "Prompt Brief Builder $version"
          Set-Content -Path release-notes.md -Value $body -Encoding UTF8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Prompt Brief Builder ${{ github.ref_name }}
          body_path: release-notes.md
          overwrite_files: true
          files: |
            release/*.exe
            release/*.blockmap

      - name: Remove installer assets from older releases
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const currentTag = context.ref.replace('refs/tags/', '');
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            for (const release of releases) {
              if (release.tag_name === currentTag) {
                continue;
              }

              for (const asset of release.assets) {
                if (!asset.name.endsWith('.exe') && !asset.name.endsWith('.blockmap')) {
                  continue;
                }

                core.info(`Deleting ${asset.name} from ${release.tag_name}`);
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id,
                });
              }
            }
