name: Release Desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Build Windows installer
        run: npm run dist:win

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Prompt Brief Builder ${{ github.ref_name }}
          body: |
            Windows desktop release for Prompt Brief Builder.

            Download the NSIS installer below, run it, then launch Prompt Brief Builder from the Start Menu or desktop shortcut.
          files: |
            release/*.exe
            release/*.blockmap
